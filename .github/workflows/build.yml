name: Build and Release

on:
  push:
    tags:
      - 'v*'               # Сборка при пуше тега v1.0.0, v2.1.3 и т.д.
  workflow_dispatch:        # Ручной запуск из интерфейса GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build IntelliJ Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: kaiten-time-logger
          path: build/distributions/*.zip

      - name: Get version from tag
        id: get_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/distributions/*.zip
          name: Kaiten Time Logger v${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Kaiten Time Logger v${{ steps.get_version.outputs.VERSION }}
            
            ### Установка
            1. Скачайте ZIP-архив ниже.
            2. В IntelliJ IDEA: `Settings → Plugins → ⚙️ → Install Plugin from Disk...`
            3. Выберите скачанный ZIP и перезапустите IDE.
            
            ### Что нового
            - Первый публичный релиз
            - Поддержка автоопределения карточки из ветки
            - Загрузка ролей из API Kaiten
            - Просмотр уже залогированного времени
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

